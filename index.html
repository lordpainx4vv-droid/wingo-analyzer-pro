<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>History</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0e0e0e;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .history-box {
      background: #1b1b1b;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 0 10px rgba(0,255,200,0.1);
      margin-bottom: 18px;
    }

    .history-title {
      text-align: center;
      background: #292929;
      color: #00ffc8;
      font-size: 17px;
      font-weight: bold;
      padding: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 350px;
    }

    th {
      background: #222;
      color: #FFD700;
      padding: 10px;
      font-size: 14px;
    }

    td {
      padding: 10px;
      font-size: 14px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.red {
      background: red;
    }

    .dot.green {
      background: lime;
    }

    .dot.violet {
      background: violet;
    }

    .num.red {
      color: #ff4c4c;
      font-weight: bold;
    }

    .num.green {
      color: #00ff88;
      font-weight: bold;
    }

    .num.violet {
      color: #bb66ff;
      font-weight: bold;
    }

    .loading {
      color: #aaa;
      padding: 15px;
    }

    .error {
      color: #ff4d4d;
      padding: 15px;
    }
  </style>
</head>

<body>

  <!-- ========================= -->
  <!-- HISTORY 1 : 30 SECOND -->
  <!-- ========================= -->

  <div class="history-box">

    <div class="history-title">
      HISTORY 1 — 30S DATA
    </div>

    <table>
      <thead>
        <tr>
          <th>Period</th>
          <th>Number</th>
          <th>Big/Small</th>
          <th>Color</th>
        </tr>
      </thead>

      <tbody id="history30s">
        <tr>
          <td colspan="4" class="loading">
            Loading 30S Data...
          </td>
        </tr>
      </tbody>
    </table>

  </div>


  <!-- ========================= -->
  <!-- HISTORY 2 : ONE MINUTE -->
  <!-- ========================= -->

  <div class="history-box">

    <div class="history-title">
      HISTORY 2 — 1M DATA
    </div>

    <table>
      <thead>
        <tr>
          <th>Period</th>
          <th>Number</th>
          <th>Big/Small</th>
          <th>Color</th>
        </tr>
      </thead>

      <tbody id="history1m">
        <tr>
          <td colspan="4" class="loading">
            Loading 1M Data...
          </td>
        </tr>
      </tbody>
    </table>

  </div>


<script>

const HISTORY_30S_API =
  'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json';

const HISTORY_1M_API =
  'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';


// =====================================================
// STORAGE KEY
// =====================================================

const STORAGE_30S = "WINGO_HISTORY_30S";
const STORAGE_1M  = "WINGO_HISTORY_1M";


// =====================================================
// LOAD SAVED DATA
// =====================================================

function getSavedHistory(storageKey) {

  try {

    const saved =
      localStorage.getItem(storageKey);

    if (!saved) {
      return [];
    }

    const parsed = JSON.parse(saved);

    if (!Array.isArray(parsed)) {
      return [];
    }

    return parsed;

  } catch (error) {

    console.error(
      "Storage Read Error:",
      error
    );

    return [];
  }
}


// =====================================================
// SAVE DATA
// =====================================================

function saveHistory(storageKey, history) {

  try {

    localStorage.setItem(
      storageKey,
      JSON.stringify(history)
    );

  } catch (error) {

    console.error(
      "Storage Save Error:",
      error
    );
  }
}


// =====================================================
// CREATE CLEAN DATA
// =====================================================

function cleanItem(item) {

  const num =
    Number.parseInt(item.number, 10);

  if (
    !Number.isInteger(num) ||
    num < 0 ||
    num > 9
  ) {
    return null;
  }

  const period =
    String(item.issueNumber ?? "").trim();

  if (!period) {
    return null;
  }


  const size =
    num >= 5 ? "Big" : "Small";


  let color;

  if (
    [1, 3, 7, 9].includes(num)
  ) {

    color = "green";

  } else if (
    [2, 4, 6, 8].includes(num)
  ) {

    color = "red";

  } else {

    color = "violet";
  }


  return {
    period: period,
    number: num,
    size: size,
    color: color
  };
}


// =====================================================
// ADD NEW DATA WITHOUT DUPLICATE
// =====================================================

function addNewData(storageKey, apiList) {

  // আগের সব data
  let history =
    getSavedHistory(storageKey);


  // শুধু valid data
  const newItems =
    apiList
      .map(cleanItem)
      .filter(item => item !== null);


  // Existing Period set
  const existingPeriods =
    new Set(
      history.map(item => item.period)
    );


  let added = 0;


  // নতুন data যোগ
  newItems.forEach(item => {

    // একই Period আগে থাকলে ignore
    if (
      existingPeriods.has(item.period)
    ) {
      return;
    }


    history.push(item);

    existingPeriods.add(item.period);

    added++;
  });


  // নতুন থেকে পুরোনো
  history.sort((a, b) => {

    if (a.period < b.period) {
      return 1;
    }

    if (a.period > b.period) {
      return -1;
    }

    return 0;
  });


  // Save
  if (added > 0) {

    saveHistory(
      storageKey,
      history
    );
  }


  return history;
}


// =====================================================
// CREATE HISTORY ROW
// =====================================================

function createHistoryRow(item) {

  const row =
    document.createElement("tr");


  // Period
  const periodCell =
    document.createElement("td");

  periodCell.textContent =
    item.period;


  // Number
  const numberCell =
    document.createElement("td");

  numberCell.className =
    "num " + item.color;

  numberCell.textContent =
    item.number;


  // Big / Small
  const sizeCell =
    document.createElement("td");

  sizeCell.textContent =
    item.size;


  // Color
  const colorCell =
    document.createElement("td");


  const dot =
    document.createElement("span");

  dot.className =
    "dot " + item.color;


  colorCell.appendChild(dot);


  row.appendChild(periodCell);
  row.appendChild(numberCell);
  row.appendChild(sizeCell);
  row.appendChild(colorCell);


  return row;
}


// =====================================================
// DISPLAY ALL SAVED HISTORY
// =====================================================

function displayHistory(
  history,
  tbodyID,
  label
) {

  const tbody =
    document.getElementById(tbodyID);


  tbody.replaceChildren();


  if (!history.length) {

    const row =
      document.createElement("tr");


    const cell =
      document.createElement("td");

    cell.colSpan = 4;

    cell.className =
      "loading";

    cell.textContent =
      "No " + label + " data yet";


    row.appendChild(cell);

    tbody.appendChild(row);

    return;
  }


  const fragment =
    document.createDocumentFragment();


  history.forEach(item => {

    const row =
      createHistoryRow(item);

    fragment.appendChild(row);

  });


  tbody.appendChild(fragment);
}


// =====================================================
// LOAD API + SAVE NEW DATA
// =====================================================

async function loadHistory(
  apiURL,
  storageKey,
  tbodyID,
  label
) {

  try {

    const response =
      await fetch(
        apiURL + "?ts=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error(
        "Network error"
      );
    }


    const data =
      await response.json();


    if (
      !data.data ||
      !Array.isArray(data.data.list)
    ) {

      throw new Error(
        "Invalid API response"
      );
    }


    // API থেকে যত data এসেছে
    const apiList =
      data.data.list;


    // নতুন data save + duplicate বাদ
    const allHistory =
      addNewData(
        storageKey,
        apiList
      );


    // সব saved history দেখাও
    displayHistory(
      allHistory,
      tbodyID,
      label
    );


    console.log(
      label +
      " total saved:",
      allHistory.length
    );


  } catch (error) {

    console.error(
      label +
      " History Error:",
      error
    );


    // API fail হলেও আগের saved data দেখাবে
    const savedHistory =
      getSavedHistory(storageKey);


    displayHistory(
      savedHistory,
      tbodyID,
      label
    );

  }
}


// =====================================================
// INITIAL LOAD
// =====================================================

loadHistory(
  HISTORY_30S_API,
  STORAGE_30S,
  "history30s",
  "30S"
);


loadHistory(
  HISTORY_1M_API,
  STORAGE_1M,
  "history1m",
  "1M"
);


// =====================================================
// AUTO CHECK — EVERY 5 SECONDS
// =====================================================

setInterval(() => {

  loadHistory(
    HISTORY_30S_API,
    STORAGE_30S,
    "history30s",
    "30S"
  );


  loadHistory(
    HISTORY_1M_API,
    STORAGE_1M,
    "history1m",
    "1M"
  );

}, 5000);

</script>

</body>
</html>
